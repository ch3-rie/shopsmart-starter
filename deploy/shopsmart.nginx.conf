# /etc/nginx/sites-available/shopsmart
# Replace YOUR-HOST with your full hostname, e.g. shopsmart-4a.duckdns.org
# Certbot adds the HTTPS (443) block and the HTTP->HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR-HOST;

    root /var/www/shopsmart;
    index index.html;

    # Express API. The Node process listens on 127.0.0.1:3000 only.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed Vite build files can be cached.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Single-page-app rewrite: /cart, /checkout, /products/2 ... all return index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
